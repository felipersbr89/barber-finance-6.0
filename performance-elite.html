<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Performance Elite — Gorilaz</title>
  <link rel="icon" type="image/x-icon" href="icons/favicon.ico">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#C6FF00">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#07070a;--s1:#111;--s2:#1a1a1a;--s3:#222;--s4:#2a2a2a;
      --b1:rgba(255,255,255,.07);--b2:rgba(255,255,255,.12);--b3:rgba(255,255,255,.18);
      --tx:#f4f4f4;--t2:#a0a0a0;--t3:#555;
      --ac:#C6FF00;--ac2:#d4ff33;--ac-dim:rgba(198,255,0,.10);--ac-bdr:rgba(198,255,0,.22);
      --gr:#4ade80;--gr-dim:rgba(74,222,128,.10);--gr-bdr:rgba(74,222,128,.22);
      --rd:#f87171;--rd-dim:rgba(248,113,113,.10);--rd-bdr:rgba(248,113,113,.22);
      --or:#fb923c;--or-dim:rgba(251,146,60,.10);--or-bdr:rgba(251,146,60,.22);
      --bl:#60a5fa;--bl-dim:rgba(96,165,250,.10);--bl-bdr:rgba(96,165,250,.22);
      --gold:#fbbf24;--gold-dim:rgba(251,191,36,.12);--gold-bdr:rgba(251,191,36,.28);
      --fd:'Space Grotesk',system-ui,sans-serif;--fb:'DM Sans',system-ui,sans-serif;
      --r:12px;--r-sm:8px;--r-lg:18px;
    }
    html{scroll-behavior:smooth}
    body{font-family:var(--fb);background:var(--bg);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased}
    a{text-decoration:none;color:inherit}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--s3);border-radius:2px}
    .hero{background:linear-gradient(135deg,#0a001a 0%,#0a0a0a 50%,#0a001a 100%);border-bottom:1px solid var(--b1);padding:32px 20px 24px;text-align:center;position:relative;overflow:hidden}
    .hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 0%,rgba(96,165,250,.08) 0%,transparent 65%);pointer-events:none}
    .hero-logo{display:inline-flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--b2);border-radius:999px;padding:6px 16px 6px 8px;margin-bottom:14px;cursor:pointer;text-decoration:none;transition:opacity .15s;position:relative;z-index:1}
    .hero-logo:hover{opacity:.85}
    .hero-logo-mark{width:26px;height:26px;background:var(--ac);border-radius:7px;overflow:hidden}
    .hero-logo-mark img{width:26px;height:26px;object-fit:cover;border-radius:7px;display:block}
    .hero-logo-text{font-family:var(--fd);font-size:12px;font-weight:700;letter-spacing:1px}
    .hero-logo-sub{font-size:8px;color:var(--ac);letter-spacing:2px;text-transform:uppercase;font-weight:600}
    h1{font-family:var(--fd);font-size:clamp(20px,4vw,28px);font-weight:700;letter-spacing:-0.5px;margin-bottom:4px;position:relative;z-index:1}
    h1 span{color:var(--bl)}
    .hero-sub{font-size:13px;color:var(--t2);position:relative;z-index:1}
    .tabs{display:flex;background:var(--s1);border-bottom:1px solid var(--b1);overflow-x:auto}
    .tab{padding:14px 20px;font-size:13px;font-weight:600;color:var(--t2);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap;transition:.15s;font-family:var(--fb)}
    .tab.active{color:var(--bl);border-bottom-color:var(--bl)}
    .tab:hover:not(.active){color:var(--tx)}
    .mes-nav{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 16px;background:var(--s1);border-bottom:1px solid var(--b1)}
    .mes-nav-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--b2);background:var(--s2);color:var(--tx);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:.15s}
    .mes-nav-btn:hover{background:var(--s3)}
    .mes-nav-btn:disabled{opacity:.3;cursor:not-allowed}
    .mes-nav-label{font-family:var(--fd);font-size:14px;font-weight:700;min-width:130px;text-align:center}
    .mes-hoje{font-size:11px;padding:2px 10px;border-radius:999px;background:var(--bl-dim);color:var(--bl);border:1px solid var(--bl-bdr);cursor:pointer;font-weight:600}
    .wrap{max-width:800px;margin:0 auto;padding:20px 16px 80px}
    .card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r-lg);padding:18px;margin-bottom:14px}
    .card.vigente{border-color:var(--bl-bdr);box-shadow:0 0 0 1px var(--bl-bdr)}
    .card-title{font-family:var(--fd);font-size:12px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:700}
    .badge-vigente{background:var(--bl);color:#000}
    .badge-master{background:var(--or-dim);color:var(--or);border:1px solid var(--or-bdr)}
    /* Realizado hero */
    .real-hero{background:var(--s2);border:1px solid var(--b2);border-radius:var(--r);padding:18px;margin-bottom:14px;text-align:center}
    .real-val{font-family:var(--fd);font-size:clamp(26px,5vw,38px);font-weight:700;color:var(--bl);line-height:1}
    .real-label{font-size:12px;color:var(--t2);margin-top:6px}
    .real-breakdown{font-size:12px;color:var(--t2);margin-top:8px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
    .real-breakdown span{color:var(--tx);font-weight:600}
    /* Metas grid */
    .metas-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
    @media(max-width:520px){.metas-grid{grid-template-columns:1fr}}
    .meta-card{background:var(--s2);border:1px solid var(--b2);border-radius:var(--r);padding:14px}
    .meta-card.atingida{border-color:var(--gr-bdr);background:var(--gr-dim)}
    .meta-card-icon{font-size:18px;margin-bottom:4px}
    .meta-card-nome{font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
    .meta-card-sub{font-size:9px;color:var(--t3);margin-bottom:6px}
    .meta-card-val{font-family:var(--fd);font-size:13px;font-weight:700;margin-bottom:4px}
    .meta-card-pct{font-size:14px;font-weight:700}
    .meta-card-falta{font-size:11px;color:var(--t2);margin-top:3px}
    .meta-card-pordia{font-size:10px;color:var(--or);margin-top:2px}
    .meta-card-comissao{font-size:11px;margin-top:6px;padding-top:6px;border-top:1px solid var(--b1)}
    .meta-card-premiacao{font-size:10px;color:var(--gold);margin-top:4px}
    .bar-wrap{height:4px;background:var(--b1);border-radius:2px;overflow:hidden;margin-top:8px}
    .bar-fill{height:100%;border-radius:2px;transition:width .6s}
    /* Lançamento */
    .lanc-box{background:var(--s2);border:1px solid var(--b2);border-radius:var(--r);padding:16px;margin-bottom:14px}
    .lanc-title{font-size:13px;font-weight:700;margin-bottom:12px}
    .lanc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
    @media(max-width:460px){.lanc-grid{grid-template-columns:1fr}}
    /* Tabela histórico */
    .hist-table{width:100%;border-collapse:collapse;font-size:12px}
    .hist-table th{font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--b1);text-align:left}
    .hist-table td{padding:8px;border-bottom:1px solid var(--b1)}
    .hist-table tr:last-child td{border-bottom:none}
    /* Ranking */
    .rank-card{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
    .rank-pos{font-family:var(--fd);font-size:15px;font-weight:700;min-width:28px;text-align:center;color:var(--t2)}
    .rank-pos.g{color:var(--gold)}.rank-pos.s{color:#94a3b8}.rank-pos.b{color:#cd7c2f}
    .rank-av{width:36px;height:36px;border-radius:50%;background:var(--bl-dim);border:2px solid var(--bl-bdr);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--bl);font-size:13px;flex-shrink:0;overflow:hidden}
    .rank-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
    .rank-info{flex:1}
    .rank-nome{font-weight:700;font-size:13px}
    .rank-sub{font-size:11px;color:var(--t2);margin-top:2px}
    .rank-pct{font-family:var(--fd);font-size:16px;font-weight:700;text-align:right}
    /* Master */
    .master-box{background:var(--s1);border:1px solid var(--or-bdr);border-radius:var(--r-lg);padding:18px;margin-bottom:14px}
    .master-badge{display:inline-flex;align-items:center;gap:6px;background:var(--or-dim);border:1px solid var(--or-bdr);border-radius:999px;padding:3px 10px;font-size:10px;font-weight:700;color:var(--or);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px}
    .prof-card{background:var(--s2);border:1px solid var(--b2);border-radius:var(--r);padding:16px;margin-bottom:10px}
    .prof-nome{font-weight:700;font-size:13px;margin-bottom:14px}
    .section-label{font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--b1)}
    .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
    @media(max-width:500px){.grid-3,.grid-2{grid-template-columns:1fr}}
    .preview-box{font-size:11px;color:var(--t3);padding:8px 10px;background:var(--s1);border-radius:var(--r-sm);margin-bottom:10px;line-height:1.7}
    /* Fields */
    .field label{display:block;font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
    .field input,.field textarea{width:100%;background:var(--s1);border:1px solid var(--b2);border-radius:var(--r-sm);color:var(--tx);font-family:var(--fb);font-size:13px;padding:8px 10px;outline:none;transition:.15s}
    .field input:focus,.field textarea:focus{border-color:var(--bl-bdr);box-shadow:0 0 0 2px var(--bl-dim)}
    .field textarea{resize:vertical;min-height:50px}
    /* Botões */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border-radius:var(--r-sm);font-family:var(--fb);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:.15s}
    .btn-blue{background:var(--bl);color:#000}.btn-blue:hover{opacity:.9}
    .btn-lime{background:var(--ac);color:#000}.btn-lime:hover{background:var(--ac2)}
    .btn-ghost{background:var(--s3);color:var(--tx);border:1px solid var(--b2)}.btn-ghost:hover{background:var(--s4)}
    .btn:disabled{opacity:.4;cursor:not-allowed}
    .spin{width:14px;height:14px;border:2px solid rgba(0,0,0,.2);border-top-color:#000;border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
    @keyframes spin{to{transform:rotate(360deg)}}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--s2);color:var(--tx);padding:10px 22px;border-radius:999px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;border:1px solid var(--b2);max-width:90vw;text-align:center;word-break:break-word}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .toast.ok{background:var(--ac-dim);color:var(--ac);border-color:var(--ac-bdr)}
    .toast.err{background:var(--rd-dim);color:var(--rd);border-color:var(--rd-bdr)}
    .loading{text-align:center;padding:40px;color:var(--t2);font-size:13px;display:flex;align-items:center;justify-content:center;gap:10px}
    .spin-bl{width:16px;height:16px;border:2px solid var(--b2);border-top-color:var(--bl);border-radius:50%;animation:spin .6s linear infinite}
    .empty{text-align:center;padding:32px;color:var(--t2);font-size:13px}
  </style>
</head>
<body>

<div class="hero">
  <a href="dashboard.html" class="hero-logo" aria-label="Voltar">
    <div class="hero-logo-mark"><img src="icons/android-chrome-192x192.png" alt="Gorilaz"></div>
    <div><div class="hero-logo-text">GORILAZ</div><div class="hero-logo-sub">Barber Finance</div></div>
  </a>
  <h1>📈 Performance <span>Elite</span></h1>
  <p class="hero-sub">Acompanhe sua evolução e supere seus limites</p>
</div>

<div class="tabs">
  <button class="tab active" id="tab-meu"     onclick="Perf.setTab('meu',this)">⚡ Meu Painel</button>
  <button class="tab"        id="tab-ranking"  onclick="Perf.setTab('ranking',this)">🏆 Ranking</button>
  <button class="tab"        id="tab-master"   onclick="Perf.setTab('master',this)" style="display:none">⚙️ Painel Master</button>
</div>

<div class="mes-nav" id="mes-nav">
  <button class="mes-nav-btn" onclick="Perf.mesAnterior()">‹</button>
  <div class="mes-nav-label" id="mes-label">...</div>
  <button class="mes-nav-btn" id="btn-next" onclick="Perf.mesProximo()">›</button>
  <button class="mes-hoje" id="btn-hoje" onclick="Perf.mesHoje()" style="display:none">Hoje</button>
</div>

<div class="wrap">
  <div id="conteudo"><div class="loading"><div class="spin-bl"></div> Carregando...</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SURL  = 'https://ixgwhyaponyssvczcabn.supabase.co'
const SANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4Z3doeWFwb255c3N2Y3pjYWJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MTA5NDYsImV4cCI6MjA5NDk4Njk0Nn0.uSyPDUn87ERrrZpzK4DmIepqO_Sbcvwt7RzlN4QB8FM'
const db = supabase.createClient(SURL, SANON)

const MASTERS = new Set(['felipersbr@gmail.com'])
let me = null          // sessão Supabase auth
let meuBarbeiro = null // registro em copa_barbeiros
let isMaster = false
let aba = 'meu'

const hoje = new Date()
let _y = hoje.getFullYear(), _m = hoje.getMonth() + 1
const mesRef    = () => `${_y}-${String(_m).padStart(2,'0')}`
const isHoje    = () => _y === hoje.getFullYear() && _m === hoje.getMonth() + 1
const diasNoMes = () => new Date(_y, _m, 0).getDate()
const diasRest  = () => isHoje() ? Math.max(1, diasNoMes() - hoje.getDate() + 1) : 1

function mesLabel(y, m) {
  if (!y) {y=_y; m=_m}
  const s = new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})
  return s.charAt(0).toUpperCase() + s.slice(1)
}

const fmt = v => 'R$ ' + Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})
const pct = (r,m) => m > 0 ? Math.min(+(r/m*100).toFixed(1), 999) : 0
const ini = n => (n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase()

function toast(msg, type='ok') {
  const el = document.getElementById('toast')
  el.textContent = msg; el.className = 'toast show ' + type
  setTimeout(() => el.className = 'toast', type==='err' ? 5000 : 3000)
}

// ── Cálculo central ──
// faturamento_cadeira = avulso bruto + assinatura bruta + produtos
// Metas: +5%, +10%, +15% sobre o faturamento da cadeira
function calcular(av, ass, pr) {
  const cadeira = +((+av) + (+ass) + (+pr)).toFixed(2)
  return {
    cadeira,
    meta:      +(cadeira * 1.05).toFixed(2),
    metaTurbo: +(cadeira * 1.10).toFixed(2),
    superMeta: +(cadeira * 1.15).toFixed(2),
  }
}

// ── Renderizar um card de meta ──
function metaCard(icon, nome, sub, valorMeta, realizado, cor, corBar, diasR, premiacao) {
  const p      = pct(realizado, valorMeta)
  const ok     = realizado >= valorMeta
  const faltaR = Math.max(0, valorMeta - realizado)
  const porDia = diasR > 0 && faltaR > 0 ? +(faltaR / diasR).toFixed(2) : 0
  // Comissão que o profissional vai ganhar ao atingir ESTA meta (= o valor da meta)
  // Já está embutido no cálculo: a meta É o faturamento da cadeira alvo
  const faltaPct = p < 100 ? +(100 - p).toFixed(1) : 0
  return `<div class="meta-card ${ok ? 'atingida' : ''}">
    <div class="meta-card-icon">${icon}</div>
    <div class="meta-card-nome">${nome}</div>
    <div class="meta-card-sub">${sub}</div>
    <div class="meta-card-val" style="color:${cor}">${fmt(valorMeta)}</div>
    <div class="meta-card-pct" style="color:${ok?'var(--gr)':cor}">${p}%${ok?' ✓':''}</div>
    ${!ok ? `
      <div class="meta-card-falta">Faltam ${faltaPct}% · ${fmt(faltaR)}</div>
      ${porDia > 0 ? `<div class="meta-card-pordia">⚡ ${fmt(porDia)}/dia</div>` : ''}
    ` : ''}
    <div class="meta-card-comissao" style="color:${cor}">
      Cadeira alvo: ${fmt(valorMeta)}
    </div>
    ${premiacao ? `<div class="meta-card-premiacao">🏅 ${premiacao}</div>` : ''}
    <div class="bar-wrap"><div class="bar-fill" style="width:${Math.min(p,100)}%;background:${corBar}"></div></div>
  </div>`
}

// ════════════════════════════════════════
const Perf = {

  setTab(t, btn) {
    aba = t
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'))
    btn.classList.add('active')
    document.getElementById('mes-nav').style.display = t === 'master' ? 'none' : ''
    this.render()
  },

  mesAnterior() { _m--; if(_m<1){_m=12;_y--}; this.render() },
  mesProximo()  { if(isHoje()) return; _m++; if(_m>12){_m=1;_y++}; this.render() },
  mesHoje()     { _y=hoje.getFullYear(); _m=hoje.getMonth()+1; this.render() },

  async render() {
    document.getElementById('mes-label').textContent = mesLabel()
    document.getElementById('btn-next').disabled = isHoje()
    document.getElementById('btn-hoje').style.display = isHoje() ? 'none' : ''
    const el = document.getElementById('conteudo')
    el.innerHTML = '<div class="loading"><div class="spin-bl"></div> Carregando...</div>'
    if (aba==='meu')     await this.renderMeu(el)
    if (aba==='ranking') await this.renderRanking(el)
    if (aba==='master')  await this.renderMaster(el)
  },

  // ── MEU PAINEL ──────────────────────────────────────
  async renderMeu(el) {
    if (!meuBarbeiro) {
      el.innerHTML = `<div class="card"><div class="empty">
        <div style="font-size:36px;margin-bottom:10px">🏆</div>
        <div style="font-weight:700;margin-bottom:8px">Acesse primeiro a Copa Gorilaz</div>
        <div style="font-size:13px;color:var(--t2)">Cadastre-se ou recupere seu acesso na Copa Gorilaz.</div>
        <div style="font-size:11px;color:var(--t3);margin-top:6px">O Performance Elite usa automaticamente o mesmo cadastro.</div>
        <a href="copa-gorilaz.html" style="display:inline-flex;align-items:center;gap:6px;margin-top:16px;background:var(--ac);color:#000;font-weight:700;padding:10px 20px;border-radius:var(--r-sm);font-size:13px">
          🏆 Ir para a Copa Gorilaz
        </a>
      </div></div>`
      return
    }

    const ref = mesRef()
    const vid = isHoje()
    const [{ data: media }, { data: reals }] = await Promise.all([
      db.from('perf_medias').select('*').eq('copa_barbeiro_id', meuBarbeiro.id).eq('mes_ref', ref).maybeSingle(),
      db.from('perf_realizado').select('*').eq('copa_barbeiro_id', meuBarbeiro.id).eq('mes_ref', ref).order('data')
    ])

    if (!media) {
      el.innerHTML = `<div class="card"><div class="empty">
        <div style="font-size:32px;margin-bottom:10px">📭</div>
        <div>Nenhuma média cadastrada para ${mesLabel()}.</div>
        <div style="font-size:11px;color:var(--t3);margin-top:6px">Solicite ao administrador.</div>
      </div></div>`
      return
    }

    const m = calcular(media.media_avulso, media.media_assinatura, media.media_produtos)
    const totalAv  = (reals||[]).reduce((s,r) => s + (+r.avulso||0), 0)
    const totalAss = (reals||[]).reduce((s,r) => s + (+r.assinatura||0), 0)
    const totalPr  = (reals||[]).reduce((s,r) => s + (+r.produtos||0), 0)
    const totalCom = +(totalAv + totalAss + totalPr).toFixed(2)
    const dr = diasRest()

    el.innerHTML = `
      <div class="card ${vid?'vigente':''}">
        <div class="card-title">
          📊 ${mesLabel()}
          ${vid ? '<span class="badge badge-vigente">● Vigente</span>' : ''}
        </div>
        <div class="real-hero">
          <div class="real-val">${fmt(totalCom)}</div>
          <div class="real-label">Faturamento da cadeira realizado</div>
          <div class="real-breakdown">
            <div>Avulso bruto: <span>${fmt(totalAv)}</span></div>
            <div>Assinatura bruta: <span>${fmt(totalAss)}</span></div>
            <div>Produtos: <span>${fmt(totalPr)}</span></div>
          </div>
        </div>
        <div class="metas-grid">
          ${metaCard('🎯','Meta','Média +5%',     m.meta,      totalCom, 'var(--ac)', '#C6FF00', dr, media.premiacao_meta)}
          ${metaCard('🔥','Meta Turbo','Média +10%', m.metaTurbo, totalCom, 'var(--or)', '#fb923c', dr, media.premiacao_meta_turbo)}
          ${metaCard('🚀','Super Meta','Média +15%', m.superMeta, totalCom, 'var(--bl)', '#60a5fa', dr, media.premiacao_super_meta)}
        </div>
        <div style="font-size:11px;color:var(--t3);line-height:1.8">
          Base (últimos 6 meses): Avulso ${fmt(media.media_avulso)}
          · Assinatura ${fmt(media.media_assinatura)}
          · Produtos ${fmt(media.media_produtos)}
          · <strong style="color:var(--t2)">Cadeira: ${fmt(m.cadeira)}</strong>
        </div>
      </div>

      ${vid ? this._lancamento(reals||[]) : ''}
      ${(reals||[]).length ? this._historico(reals) : ''}
    `
    if (vid) { /* onclick já via HTML */ }
  },

  _lancamento(reals) {
    const hj  = hoje.toISOString().split('T')[0]
    const reg = reals.find(r => r.data === hj)
    return `<div class="lanc-box">
      <div class="lanc-title">📝 Lançamento de hoje
        ${reg ? '<span class="badge" style="background:var(--gr-dim);color:var(--gr);border:1px solid var(--gr-bdr)">✓ Já lançado</span>' : ''}
      </div>
      <div class="lanc-grid">
        <div class="field"><label>💈 Avulso bruto</label>
          <input type="number" id="l-av" step="0.01" min="0" value="${reg?.avulso||0}"></div>
        <div class="field"><label>📋 Assinatura bruta</label>
          <input type="number" id="l-ass" step="0.01" min="0" value="${reg?.assinatura||0}"></div>
        <div class="field"><label>📦 Produtos</label>
          <input type="number" id="l-pr" step="0.01" min="0" value="${reg?.produtos||0}"></div>
      </div>
      <button class="btn btn-blue" id="btn-lancar" onclick="Perf.lancar()">
        💾 ${reg ? 'Atualizar' : 'Salvar lançamento'}
      </button>
    </div>`
  },

  _historico(reals) {
    const rows = [...reals].reverse().map(r => {
      const cadeira = +((+r.avulso) + (+r.assinatura) + (+r.produtos)).toFixed(2)
      const d = new Date(r.data+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})
      return `<tr>
        <td>${d}</td>
        <td>${fmt(r.avulso)}</td>
        <td>${fmt(r.assinatura)}</td>
        <td>${fmt(r.produtos)}</td>
        <td style="font-weight:700">${fmt(cadeira)}</td>
      </tr>`
    }).join('')
    return `<div class="card">
      <div class="card-title">📋 Histórico do mês</div>
      <div style="overflow-x:auto">
        <table class="hist-table">
          <thead><tr><th>Data</th><th>Avulso</th><th>Assinatura</th><th>Produtos</th><th>Cadeira</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`
  },

  async lancar() {
    if (!meuBarbeiro) { toast('Sem cadastro na Copa Gorilaz.','err'); return }
    const btn = document.getElementById('btn-lancar')
    btn.disabled = true; btn.innerHTML = '<div class="spin"></div> Salvando...'
    const ref = mesRef()
    const hj  = hoje.toISOString().split('T')[0]
    const { error } = await db.from('perf_realizado').upsert({
      copa_barbeiro_id: meuBarbeiro.id,
      user_id: me?.id || null,
      mes_ref: ref, data: hj,
      avulso:    parseFloat(document.getElementById('l-av')?.value)  || 0,
      assinatura:parseFloat(document.getElementById('l-ass')?.value) || 0,
      produtos:  parseFloat(document.getElementById('l-pr')?.value)  || 0,
      updated_at: new Date().toISOString()
    }, { onConflict: 'copa_barbeiro_id,data' })
    btn.disabled = false
    if (error) { toast('Erro: '+error.message,'err') }
    else { toast('Lançamento salvo! ✓'); await this.render() }
  },

  // ── RANKING ─────────────────────────────────────────
  async renderRanking(el) {
    const ref = mesRef()
    const [{ data: barbeiros }, { data: medias }, { data: reals }] = await Promise.all([
      db.from('copa_barbeiros').select('id,nome,barbearia,user_id').order('nome'),
      db.from('perf_medias').select('*').eq('mes_ref', ref),
      db.from('perf_realizado').select('*').eq('mes_ref', ref)
    ])

    if (!medias?.length) {
      el.innerHTML = '<div class="empty">Nenhuma meta cadastrada para este mês.</div>'
      return
    }

    // Mapas
    const mediaMap = {}; (medias||[]).forEach(m => mediaMap[m.copa_barbeiro_id] = m)
    const realMap  = {}; (reals||[]).forEach(r => {
      realMap[r.copa_barbeiro_id] = (realMap[r.copa_barbeiro_id]||0) + (+r.avulso||0) + (+r.assinatura||0) + (+r.produtos||0)
    })

    // Avatar de profiles
    const avatarMap = {}
    const uids = [...new Set((barbeiros||[]).map(b=>b.user_id).filter(Boolean))]
    await Promise.all(uids.map(async uid => {
      const { data: p } = await db.from('profiles').select('user_id,avatar_url').eq('user_id', uid).maybeSingle()
      if (p?.avatar_url) avatarMap[uid] = p.avatar_url
    }))

    const ranking = (barbeiros||[])
      .filter(b => mediaMap[b.id])
      .map(b => {
        const med = mediaMap[b.id]
        const m   = calcular(med.media_avulso, med.media_assinatura, med.media_produtos)
        const real = +(realMap[b.id]||0).toFixed(2)
        return { ...b, metas:m, real, pct: pct(real, m.meta) }
      })
      .sort((a,b) => b.pct - a.pct)

    const posI = ['🥇','🥈','🥉']
    const posC = ['g','s','b']
    el.innerHTML = `
      <div style="font-size:11px;color:var(--t2);text-align:center;margin-bottom:10px">Classificação por % da Meta atingida</div>
      ${ranking.map((r,i) => {
        const ok = r.real >= r.metas.meta
        const isEu = meuBarbeiro && r.id === meuBarbeiro.id
        const av = r.user_id ? avatarMap[r.user_id] : null
        return `<div class="rank-card">
          <div class="rank-pos ${posC[i]||''}">${i<3?posI[i]:(i+1)+'°'}</div>
          <div class="rank-av">${av ? `<img src="${av}" alt="${r.nome}">` : ini(r.nome)}</div>
          <div class="rank-info">
            <div class="rank-nome">${r.nome}${isEu?' <span style="font-size:10px;color:var(--ac)">(você)</span>':''}</div>
            <div class="rank-sub">${r.barbearia} · ${fmt(r.real)} / ${fmt(r.metas.meta)}</div>
          </div>
          <div>
            <div class="rank-pct" style="color:${ok?'var(--gr)':'var(--bl)'}">${r.pct}%</div>
            ${ok ? '<div style="font-size:10px;color:var(--gr);text-align:right">✅ Meta</div>' : ''}
          </div>
        </div>`
      }).join('')}
    `
  },

  // ── PAINEL MASTER ────────────────────────────────────
  async renderMaster(el) {
    if (!isMaster) { el.innerHTML = '<div class="empty">Acesso restrito.</div>'; return }
    const ref = mesRef()
    const [{ data: barbeiros }, { data: medias }] = await Promise.all([
      db.from('copa_barbeiros').select('id,nome,barbearia').order('nome'),
      db.from('perf_medias').select('*').eq('mes_ref', ref)
    ])
    if (!barbeiros?.length) {
      el.innerHTML = '<div class="empty">Nenhum profissional na Copa Gorilaz.</div>'
      return
    }
    const mMap = {}; (medias||[]).forEach(m => mMap[m.copa_barbeiro_id] = m)

    el.innerHTML = `<div class="master-box">
      <div class="master-badge">⚙️ Painel Master — ${mesLabel()}</div>
      ${barbeiros.map(b => {
        const med = mMap[b.id] || {}
        const m = calcular(med.media_avulso||0, med.media_assinatura||0, med.media_produtos||0)
        const bid = b.id
        return `<div class="prof-card" id="prof-${bid}">
          <div class="prof-nome">👤 ${b.nome} <span style="font-size:11px;color:var(--t2);font-weight:400">· ${b.barbearia}</span></div>

          <div class="section-label">📊 Médias dos últimos 6 meses</div>
          <div class="grid-3" style="margin-bottom:12px">
            <div class="field"><label>💈 Avulso bruto</label>
              <input type="number" id="av-${bid}" value="${med.media_avulso||0}" step="0.01" min="0"></div>
            <div class="field"><label>📋 Assinatura bruta</label>
              <input type="number" id="ass-${bid}" value="${med.media_assinatura||0}" step="0.01" min="0"></div>
            <div class="field"><label>📦 Produtos</label>
              <input type="number" id="pr-${bid}" value="${med.media_produtos||0}" step="0.01" min="0"></div>
          </div>

          <div class="preview-box" id="prev-${bid}">
            Cadeira: ${fmt(m.cadeira)} → 🎯 ${fmt(m.meta)} · 🔥 ${fmt(m.metaTurbo)} · 🚀 ${fmt(m.superMeta)}
          </div>

          <div class="section-label">🏅 Premiações do mês vigente</div>
          <div class="grid-3" style="margin-bottom:12px">
            <div class="field"><label>🎯 Premiação Meta</label>
              <textarea id="pm-${bid}" rows="2">${med.premiacao_meta||''}</textarea></div>
            <div class="field"><label>🔥 Premiação Meta Turbo</label>
              <textarea id="pt-${bid}" rows="2">${med.premiacao_meta_turbo||''}</textarea></div>
            <div class="field"><label>🚀 Premiação Super Meta</label>
              <textarea id="ps-${bid}" rows="2">${med.premiacao_super_meta||''}</textarea></div>
          </div>

          <button class="btn btn-lime" style="padding:7px 16px;font-size:12px" onclick="Perf.salvar(${bid})">
            💾 Salvar
          </button>
        </div>`
      }).join('')}
    </div>`

    // Preview em tempo real
    barbeiros.forEach(b => {
      const ids = ['av','ass','pr'].map(k => document.getElementById(`${k}-${b.id}`))
      const pv  = document.getElementById(`prev-${b.id}`)
      const upd = () => {
        const m = calcular(...ids.map(el => parseFloat(el?.value)||0))
        pv.textContent = `Cadeira: ${fmt(m.cadeira)} → 🎯 ${fmt(m.meta)} · 🔥 ${fmt(m.metaTurbo)} · 🚀 ${fmt(m.superMeta)}`
      }
      ids.forEach(el => el?.addEventListener('input', upd))
    })
  },

  async salvar(bid) {
    if (!isMaster) { toast('Sem permissão.','err'); return }
    const g = id => parseFloat(document.getElementById(`${id}-${bid}`)?.value) || 0
    const t = id => document.getElementById(`${id}-${bid}`)?.value?.trim() || null
    const ref = mesRef()
    const av = g('av'), ass = g('ass'), pr = g('pr')
    const m = calcular(av, ass, pr)

    const { error } = await db.from('perf_medias').upsert({
      copa_barbeiro_id:    bid,
      mes_ref:             ref,
      media_avulso:        av,
      media_assinatura:    ass,
      media_produtos:      pr,
      media_cadeira:       m.cadeira,
      premiacao_meta:       t('pm'),
      premiacao_meta_turbo: t('pt'),
      premiacao_super_meta: t('ps'),
      updated_at:          new Date().toISOString()
    }, { onConflict: 'copa_barbeiro_id,mes_ref' })

    if (error) toast('Erro: '+error.message,'err')
    else toast('Salvo! ✓')
  }
}

// ── Init ──
async function init() {
  // 1. Tentar sessão Supabase (para isMaster via email)
  try {
    const { data: { session } } = await db.auth.getSession()
    if (session?.user) {
      me = session.user
      isMaster = MASTERS.has(me.email?.toLowerCase()?.trim()||'')
      if (isMaster) document.getElementById('tab-master').style.display = ''
    }
  } catch(_) {}

  // 2. Identificar barbeiro via localStorage da Copa Gorilaz
  //    A Copa salva: { id, nome, barbearia, ... } em 'copa_barbeiro'
  //    Não é necessário login — o mesmo cadastro da Copa é usado aqui
  const saved = localStorage.getItem('copa_barbeiro')
  if (saved) {
    try {
      const barb = JSON.parse(saved)
      if (barb?.id && barb?.nome) {
        // Buscar dados atualizados do banco (garante que user_id está preenchido)
        const { data: barbDB } = await db.from('copa_barbeiros')
          .select('*').eq('id', Number(barb.id)).maybeSingle()
        const b = barbDB || barb
        meuBarbeiro = b
        console.log('[Perf] Barbeiro identificado:', meuBarbeiro.nome)
      }
    } catch(e) { console.warn('[Perf] localStorage inválido:', e) }
  }

  // 3. Se não encontrou pelo localStorage, tentar pelo user_id do Auth
  if (!meuBarbeiro && me?.id) {
    const { data: barb } = await db.from('copa_barbeiros')
      .select('*').eq('user_id', me.id).maybeSingle()
    if (barb) {
      meuBarbeiro = barb
    }
  }

  await Perf.render()
}

init()
</script>
</body>
</html>
